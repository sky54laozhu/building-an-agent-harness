<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:radial-gradient(1100px 560px at 80% -12%, #16263f 0%, #0c0d10 56%);
    color:#e7e9ee;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:74px 84px; display:flex; flex-direction:column; justify-content:space-between;
    -webkit-font-smoothing:antialiased;
  }
  .brand{font-size:23px; letter-spacing:.5px; color:#9aa0ad; font-weight:700}
  .brand b{color:#7ee0c0}
  h1{font-size:64px; line-height:1.14; font-weight:800; margin:0; letter-spacing:-.5px}
  h1 .a{color:#7ee0c0}
  .lede{font-size:24px; color:#9aa0ad; margin-top:24px; max-width:920px; line-height:1.5}
  .stats{display:flex; gap:46px}
  .stat b{display:block; font-size:48px; color:#5b9dff; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
  .stat span{font-size:17px; color:#9aa0ad}
</style>
</head>
<body>
  <div class="brand">Lao Zhu · <b>Agent Harness</b></div>
  <div>
    <h1>49 天,一个人造了一个<br><span class="a">生产级 AI Agent Harness</span></h1>
    <div class="lede">18 篇双语工程拆解 —— 每个架构决策都有真实代码与数字支撑</div>
  </div>
  <div class="stats">
    <div class="stat"><b>49</b><span>天 · solo</span></div>
    <div class="stat"><b>287</b><span>commits</span></div>
    <div class="stat"><b>60K</b><span>行代码</span></div>
    <div class="stat"><b>110</b><span>测试</span></div>
    <div class="stat"><b>18</b><span>篇拆解</span></div>
  </div>
</body>
</html>
