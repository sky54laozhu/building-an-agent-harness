  <!-- Legend -->
  <rect x="40" y="500" width="800" height="60" fill="#f6f7f9" stroke="#5a5a5a" rx="4"/>
  <text x="55" y="520" class="label" font-weight="600" fill="#1a2233">关键观察：</text>
  <text x="55" y="538" class="label">1. 三条都是 try/catch 包裹（<tspan font-family="'SF Mono', Consolas, monospace">loop.ts:46-71</tspan>），任意一条 throw → console.warn 或 skip，<tspan font-weight="600">不会阻塞用户问答</tspan></text>
  <text x="55" y="554" class="label">2. 路径 2 的「4 类型」（user/feedback/project/reference）与路径 3 的「4 category」（fact/preference/context/correction）<tspan font-weight="600">完全不重合</tspan> —— 真坑</text>
