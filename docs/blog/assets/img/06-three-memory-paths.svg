<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-3p d-3p">
  <title id="t-3p">三条记忆路径全景</title>
  <desc id="d-3p">HarWork 长期记忆的三条独立路径：1) CLAUDE.md 指令（用户手写、git tracked、claudemd.ts 144行）；2) 文件 memory（模型用 Write 工具写、.claude/memory/、memory-files.ts 128行）；3) DB memory（LLM 抽取、StorageProvider、memory.ts 122行）。三条在 loop.ts:47-70 各自加载，通过 prompts.ts 注入不同标题的 system prompt section。三条独立 try/catch，互不阻塞。</desc>
  <style>
    .lane-path1 { fill: #dbeafe; stroke: #1e40af; stroke-width: 1.5; }
    .lane-path2 { fill: #d1fae5; stroke: #047857; stroke-width: 1.5; }
    .lane-path3 { fill: #fef3c7; stroke: #a16207; stroke-width: 1.5; }
