    .label-mono { fill: #1a1a1a; font-size: 11px; font-family: 'SF Mono', Consolas, monospace; }
    .label-mono-sm { fill: #1a1a1a; font-size: 10px; font-family: 'SF Mono', Consolas, monospace; }
    .arrow { stroke: #1a2233; stroke-width: 1.5; fill: none; }
    .note { fill: #5a5a5a; font-size: 11px; font-style: italic; }
    .header { fill: #1a2233; font-size: 11px; font-weight: 600; }
