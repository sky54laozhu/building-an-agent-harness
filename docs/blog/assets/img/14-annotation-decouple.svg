<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-ad d-ad">
  <title id="t-ad">标注与产物解耦 · agent 重新生成 HTML 时标注仍挂得住</title>
  <desc id="d-ad">展示 HarWork 的标注存储模型：HTML 内容存在 design_versions 表的 html_content 字段，用户标注存在独立的 design_annotations 表，通过 versionId + elementSelector 关联。agent 调用 design 工具时拿 status=pending 的标注序列化进 prompt，重新生成 HTML 后写入新的 version；旧 version 的标注通过 selector 在新 HTML 里 querySelector 重新挂载（90% 命中），失配的标注保持 pending 让 agent 处理。状态机：pending → applied / dismissed。</desc>
  <style>
    .label { fill: #1a1a1a; font-size: 11px; }
    .label-sm { fill: #1a1a1a; font-size: 10px; }
    .label-mono { fill: #1a1a1a; font-size: 10.5px; font-family: 'SF Mono', Consolas, monospace; }
    .label-mono-sm { fill: #1a1a1a; font-size: 9.5px; font-family: 'SF Mono', Consolas, monospace; }
    .note { fill: #5a5a5a; font-size: 10px; font-style: italic; }
    .header { font-weight: 700; font-size: 12px; }
    .version-box { fill: #fef3c7; stroke: #a16207; stroke-width: 1.5; }
    .annot-box { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .agent-box { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; }
    .arrow-flow { stroke: #047857; stroke-width: 1.5; fill: none; }
    .arrow-ref { stroke: #1d4ed8; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
    .state-pending { fill: #fde68a; stroke: #b45309; }
    .state-applied { fill: #bbf7d0; stroke: #15803d; }
    .state-dismissed { fill: #fecaca; stroke: #b91c1c; }
  </style>
  <defs>
    <marker id="ar-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="ar-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="20" y="28" class="header" font-size="14">标注 metadata 独立表 · 跨 version 通过 selector 重新挂载</text>

  <!-- design_versions table -->
  <rect x="30" y="60" width="380" height="170" rx="6" class="version-box"/>
  <text x="220" y="82" text-anchor="middle" class="header">design_versions 表（产物）</text>
  <text x="220" y="98" text-anchor="middle" class="label-mono">design-schema.ts</text>

  <rect x="50" y="118" width="340" height="44" rx="4" fill="#fff" stroke="#a16207"/>
  <text x="60" y="135" class="label-mono">v1: html_content = "&lt;html&gt;...原稿...&lt;/html&gt;"</text>
  <text x="60" y="151" class="label-mono-sm">id=v1 · projectId=p1 · createdAt=10:30</text>

  <rect x="50" y="170" width="340" height="44" rx="4" fill="#fff" stroke="#a16207"/>
  <text x="60" y="187" class="label-mono">v2: html_content = "&lt;html&gt;...第2版...&lt;/html&gt;"</text>
  <text x="60" y="203" class="label-mono-sm">id=v2 · projectId=p1 · createdAt=11:15</text>

  <!-- design_annotations table -->
  <rect x="30" y="260" width="380" height="240" rx="6" class="annot-box"/>
  <text x="220" y="282" text-anchor="middle" class="header">design_annotations 表（metadata · 独立）</text>
  <text x="220" y="298" text-anchor="middle" class="label-mono">design-schema.ts:47-66</text>

  <rect x="50" y="316" width="340" height="56" rx="4" fill="#fff" stroke="#1d4ed8"/>
  <text x="60" y="333" class="label-mono">{ versionId: v1, selector: '#cta-wrap &gt; button.cta',</text>
  <text x="60" y="349" class="label-mono">  content: '这块改得太挤了',</text>
  <text x="60" y="365" class="label-mono">  status: <tspan class="state-pending" font-weight="700">pending</tspan> }</text>

  <rect x="50" y="380" width="340" height="56" rx="4" fill="#fff" stroke="#1d4ed8"/>
  <text x="60" y="397" class="label-mono">{ versionId: v1, selector: 'div.hero &gt; h1',</text>
  <text x="60" y="413" class="label-mono">  content: '标题字号缩小',</text>
  <text x="60" y="429" class="label-mono">  status: <tspan class="state-applied" font-weight="700">applied</tspan> · 已被 agent 处理 }</text>

  <rect x="50" y="444" width="340" height="44" rx="4" fill="#fff" stroke="#1d4ed8"/>
  <text x="60" y="461" class="label-mono">{ versionId: v1, selector: '.footer p',</text>
  <text x="60" y="477" class="label-mono">  content: '...',  status: <tspan class="state-dismissed" font-weight="700">dismissed</tspan> }</text>

  <line x1="220" y1="230" x2="220" y2="258" class="arrow-ref" marker-end="url(#ar-ref)"/>
  <text x="226" y="248" class="label-mono-sm" fill="#1d4ed8">FK: versionId</text>

  <!-- Agent loop -->
  <rect x="450" y="60" width="400" height="440" rx="6" class="agent-box"/>
  <text x="650" y="82" text-anchor="middle" class="header">下一轮 agent 调 design 工具</text>

  <rect x="470" y="105" width="360" height="56" rx="4" fill="#fff" stroke="#6d28d9"/>
  <text x="480" y="122" class="label header">① 拉 pending 标注</text>
  <text x="480" y="139" class="label-mono-sm">GET annotations?status=pending</text>
  <text x="480" y="153" class="label-mono-sm">→ 序列化进 prompt 给 LLM</text>

  <rect x="470" y="170" width="360" height="56" rx="4" fill="#fff" stroke="#6d28d9"/>
  <text x="480" y="187" class="label header">② LLM 重新生成 HTML（v2）</text>
  <text x="480" y="204" class="label-sm">收到结构化标注 = 精确指代</text>
  <text x="480" y="220" class="note">无需视觉理解 / 无需截图</text>

  <rect x="470" y="235" width="360" height="80" rx="4" fill="#fff" stroke="#6d28d9"/>
  <text x="480" y="252" class="label header">③ 标注通过 selector 重新挂载</text>
  <text x="480" y="269" class="label-mono-sm">v2.querySelector('#cta-wrap &gt; button.cta')</text>
  <text x="480" y="286" class="label-mono-sm"> · 命中 → 标注 UI 在新位置画出来（90%）</text>
  <text x="480" y="302" class="label-mono-sm"> · 失配 → 保持 pending 让 agent 看着办（10%）</text>

  <rect x="470" y="324" width="360" height="80" rx="4" fill="#fff" stroke="#6d28d9"/>
  <text x="480" y="341" class="label header">④ agent 标注转 applied</text>
  <text x="480" y="358" class="label-mono-sm">UPDATE annotations SET status='applied'</text>
  <text x="480" y="374" class="label-mono-sm">WHERE id IN (...)  · 下一轮就不再喂给 LLM</text>
  <text x="480" y="391" class="note">状态机：pending → applied（处理过）/ dismissed（用户撤回）</text>

  <text x="650" y="430" text-anchor="middle" class="note">解耦的本质：</text>
  <text x="650" y="446" text-anchor="middle" class="note">标注是 metadata，不是产物的一部分；</text>
  <text x="650" y="462" text-anchor="middle" class="note">selector 在多 version 间充当"逻辑指针"；</text>
  <text x="650" y="478" text-anchor="middle" class="note">agent 拿到的是结构化输入，不是文字描述。</text>

  <line x1="410" y1="345" x2="470" y2="345" class="arrow-flow" marker-end="url(#ar-flow)"/>
  <text x="415" y="338" class="label-mono-sm" fill="#047857">读 pending</text>
</svg>
