<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-st d-st">
  <title id="t-st">share token 生命周期 · TTL + 软撤销</title>
  <desc id="d-st">展示 HarWork 组织级 share token 的状态机：创建时携带 permission(view/edit) 和 expiresAt(可空 = 永不过期)，访问时 isShareValid 按"先看 revokedAt 再看 expiresAt 最后看永不过期"三步校验，撤销永远优先。DELETE 是软删（set revokedAt = new Date()）不是物理删除。校验失败返回 403 而非 404 区分"不存在"和"失效"。withAuth 包了 shared/[token] 路由 — share 不是匿名访问、要求登录；但缺 isOrgMember 校验是已知工程债。</desc>
  <style>
    .label { fill: #1a1a1a; font-size: 11px; }
    .label-sm { fill: #1a1a1a; font-size: 10px; }
    .label-mono { fill: #1a1a1a; font-size: 10.5px; font-family: 'SF Mono', Consolas, monospace; }
    .label-mono-sm { fill: #1a1a1a; font-size: 9.5px; font-family: 'SF Mono', Consolas, monospace; }
    .note { fill: #5a5a5a; font-size: 10px; font-style: italic; }
    .header { font-weight: 700; font-size: 12px; }
    .state-create { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .state-active { fill: #fef9c3; stroke: #a16207; stroke-width: 2; }
    .state-revoked { fill: #fecaca; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 4 2; }
    .state-expired { fill: #fed7aa; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 4 2; }
    .check { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .gate { fill: #ddd6fe; stroke: #6d28d9; stroke-width: 1.5; }
    .terminal-ok { fill: #bbf7d0; stroke: #15803d; stroke-width: 1.5; }
    .terminal-403 { fill: #fecaca; stroke: #b91c1c; stroke-width: 1.5; }
    .terminal-404 { fill: #e5e7eb; stroke: #4b5563; stroke-width: 1.5; }
    .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .arrow-ok { stroke: #15803d; stroke-width: 1.5; fill: none; }
    .arrow-fail { stroke: #b91c1c; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
    .arrow-gap { stroke: #b45309; stroke-width: 1.5; fill: none; stroke-dasharray: 2 2; }
  </style>
  <defs>
    <marker id="ar-blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="20" y="28" class="header" font-size="14">share token 生命周期 · isShareValid 三步校验 + 软撤销</text>
  <text x="20" y="46" class="note">design-shares-schema.ts:12-16 · share-utils.ts:12-16 · shared/[token]/route.ts:34-36</text>

  <!-- Step 1: Create -->
  <rect x="20" y="70" width="180" height="100" rx="6" class="state-create"/>
  <text x="110" y="92" text-anchor="middle" class="label header" fill="#15803d">创建 share</text>
  <text x="110" y="110" text-anchor="middle" class="label-mono-sm">POST /projects/[id]/shares</text>
  <text x="30" y="130" class="label-mono-sm">permission: 'view' | 'edit'</text>
  <text x="30" y="146" class="label-mono-sm">expiresAt: ms | null</text>
  <text x="30" y="162" class="label-mono-sm">shareToken: nanoid(32)</text>

  <text x="35" y="190" class="note">UI 预设 expiresAt：</text>
  <text x="35" y="205" class="label-mono-sm">Never / 1h / 24h / 7d / 30d</text>
  <text x="35" y="222" class="note">design-share-dialog.tsx:18-24</text>

  <!-- Step 2: Access path -->
  <rect x="240" y="70" width="180" height="60" rx="6" class="check"/>
  <text x="330" y="92" text-anchor="middle" class="label header" fill="#ea580c">GET /shared/[token]</text>
  <text x="330" y="110" text-anchor="middle" class="label-mono-sm">withAuth 包裹</text>
  <text x="330" y="124" text-anchor="middle" class="note">route.ts:17 · 需登录</text>

  <line x1="200" y1="100" x2="240" y2="100" class="arrow" marker-end="url(#ar-blk)"/>

  <!-- Step 3: isShareValid check -->
  <rect x="240" y="160" width="180" height="160" rx="6" class="check"/>
  <text x="330" y="182" text-anchor="middle" class="label header" fill="#ea580c">isShareValid 三步</text>
  <text x="330" y="198" text-anchor="middle" class="label-mono-sm">share-utils.ts:12-16</text>

  <rect x="250" y="210" width="160" height="28" rx="3" fill="#fff" stroke="#b91c1c"/>
  <text x="330" y="228" text-anchor="middle" class="label-mono-sm" fill="#b91c1c">1. revokedAt !== null?</text>

  <rect x="250" y="245" width="160" height="28" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="330" y="263" text-anchor="middle" class="label-mono-sm" fill="#c2410c">2. expiresAt ≤ now?</text>

  <rect x="250" y="280" width="160" height="28" rx="3" fill="#fff" stroke="#15803d"/>
  <text x="330" y="298" text-anchor="middle" class="label-mono-sm" fill="#15803d">3. else valid (含永不过期)</text>

  <line x1="330" y1="130" x2="330" y2="160" class="arrow" marker-end="url(#ar-blk)"/>

  <!-- Outcomes -->
  <rect x="470" y="80" width="160" height="60" rx="6" class="terminal-404"/>
  <text x="550" y="102" text-anchor="middle" class="label header" fill="#4b5563">404 Not Found</text>
  <text x="550" y="118" text-anchor="middle" class="label-mono-sm">token 不存在</text>
  <text x="550" y="132" text-anchor="middle" class="note">DB 查不到</text>

  <rect x="470" y="160" width="160" height="60" rx="6" class="terminal-403"/>
  <text x="550" y="182" text-anchor="middle" class="label header" fill="#b91c1c">403 Forbidden (撤销)</text>
  <text x="550" y="198" text-anchor="middle" class="label-mono-sm">revokedAt != null</text>
  <text x="550" y="213" text-anchor="middle" class="note">优先级最高</text>

  <rect x="470" y="240" width="160" height="60" rx="6" class="terminal-403"/>
  <text x="550" y="262" text-anchor="middle" class="label header" fill="#b91c1c">403 Forbidden (过期)</text>
  <text x="550" y="278" text-anchor="middle" class="label-mono-sm">expiresAt &lt; now</text>
  <text x="550" y="293" text-anchor="middle" class="note">区分 404 / 403</text>

  <rect x="470" y="320" width="160" height="60" rx="6" class="gate"/>
  <text x="550" y="342" text-anchor="middle" class="label header" fill="#6d28d9">isOrgMember? (TODO)</text>
  <text x="550" y="358" text-anchor="middle" class="label-mono-sm">route.ts:11 注释</text>
  <text x="550" y="373" text-anchor="middle" class="note">当前缺校验 = 工程债</text>

  <rect x="680" y="320" width="160" height="60" rx="6" class="terminal-ok"/>
  <text x="760" y="342" text-anchor="middle" class="label header" fill="#15803d">200 OK</text>
  <text x="760" y="358" text-anchor="middle" class="label-mono-sm">return project + perms</text>
  <text x="760" y="373" text-anchor="middle" class="note">view 或 edit 模式</text>

  <!-- arrows from checks to outcomes -->
  <line x1="420" y1="110" x2="470" y2="110" class="arrow" marker-end="url(#ar-blk)"/>
  <line x1="420" y1="224" x2="470" y2="190" class="arrow-fail" marker-end="url(#ar-red)"/>
  <line x1="420" y1="259" x2="470" y2="270" class="arrow-fail" marker-end="url(#ar-red)"/>
  <line x1="420" y1="294" x2="470" y2="350" class="arrow-ok" marker-end="url(#ar-grn)"/>
  <line x1="630" y1="350" x2="680" y2="350" class="arrow-gap" marker-end="url(#ar-org)"/>

  <!-- Soft revoke -->
  <rect x="20" y="250" width="180" height="100" rx="6" class="state-revoked"/>
  <text x="110" y="272" text-anchor="middle" class="label header" fill="#b91c1c">软撤销</text>
  <text x="110" y="290" text-anchor="middle" class="label-mono-sm">DELETE /shares/[shareId]</text>
  <text x="30" y="310" class="label-mono-sm">UPDATE set</text>
  <text x="30" y="326" class="label-mono-sm">  revokedAt = new Date()</text>
  <text x="30" y="345" class="note">shares/[shareId]/route.ts:121-122</text>

  <line x1="110" y1="170" x2="110" y2="250" class="arrow-fail" marker-end="url(#ar-red)"/>
  <text x="115" y="210" class="label-sm" fill="#b91c1c">owner 撤销</text>

  <!-- URL mismatch note -->
  <rect x="680" y="80" width="180" height="220" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="770" y="102" text-anchor="middle" class="label header" fill="#b45309">已知工程债</text>

  <text x="690" y="124" class="label-sm" fill="#b45309">坑 1：URL 格式不对齐</text>
  <text x="690" y="140" class="label-mono-sm">dialog 拼：</text>
  <text x="690" y="155" class="label-mono-sm" fill="#b91c1c">/design/project/[id]?token=</text>
  <text x="690" y="170" class="label-mono-sm">server 路由：</text>
  <text x="690" y="185" class="label-mono-sm" fill="#15803d">/api/design/shared/[token]</text>
  <text x="690" y="200" class="note">→ page.tsx 客户端胶水</text>

  <text x="690" y="224" class="label-sm" fill="#b45309">坑 2：缺 isOrgMember</text>
  <text x="690" y="240" class="label-mono-sm">route.ts:11 TODO 标记</text>
  <text x="690" y="256" class="label-mono-sm">share-utils.ts:26-29</text>
  <text x="690" y="271" class="label-mono-sm">isOrgMember 已写但未调用</text>
  <text x="690" y="287" class="note">→ 跨组织 token 可被滥用</text>

  <!-- Footer -->
  <rect x="20" y="430" width="840" height="100" rx="4" fill="#fff" stroke="#0284c7"/>
  <text x="30" y="450" class="label header">3 个设计决策</text>
  <text x="30" y="470" class="label-sm">① <tspan class="label-mono-sm">permission</tspan> 二选一 (view/edit) — 不做 comment-only 中间态，评论走 annotation (Part 14)</text>
  <text x="30" y="488" class="label-sm">② <tspan class="label-mono-sm">expiresAt</tspan> 可空 = 永不过期 — UI 预设是封装，底层支持任意 timestamp_ms</text>
  <text x="30" y="506" class="label-sm">③ <tspan class="label-mono-sm">revokedAt</tspan> 软撤销 — DELETE 不物理删，方便审计 + 不允许"过期→重新激活"</text>
  <text x="30" y="524" class="note">校验顺序"revoked → expired → valid"是有意为之：撤销永远不能被反悔</text>
</svg>
