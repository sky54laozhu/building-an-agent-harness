<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-hb d-hb">
  <title id="t-hb">Engine 容器 vs 用户容器：hook 跑在哪</title>
  <desc id="d-hb">HarWork 把 hook 命令推到用户容器内执行（通过 executor.exec），而不是 Engine 进程内。Engine 只负责调度、监听 HOOK_INPUT 注入、监控超时、聚合结果。这条边界让 hook 和 LLM 共享同一权限基线，彻底防止用户脚本读 Engine .env、kill 其他用户、写 host filesystem。</desc>
  <style>
    .label { fill: #1a1a1a; font-size: 11px; }
    .label-sm { fill: #1a1a1a; font-size: 10px; }
    .label-mono { fill: #1a1a1a; font-size: 10px; font-family: 'SF Mono', Consolas, monospace; }
    .label-mono-sm { fill: #1a1a1a; font-size: 9.5px; font-family: 'SF Mono', Consolas, monospace; }
    .note { fill: #5a5a5a; font-size: 10px; font-style: italic; }
    .header { font-weight: 700; font-size: 12px; }
    .engine-box { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
    .user-box { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .host { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .component { fill: #fff; stroke: #5a5a5a; stroke-width: 1; }
    .hook-cmd { fill: #fef3c7; stroke: #a16207; stroke-width: 1.5; }
    .arrow { stroke: #1a2233; stroke-width: 1.5; fill: none; }
    .exec-arrow { stroke: #047857; stroke-width: 2; fill: none; }
    .blocked-arrow { stroke: #b91c1c; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="hb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
    <marker id="hb-exec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="hb-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#fafbfc" stroke="#1a2233" stroke-width="2"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">Engine 容器 vs 用户容器：hook 命令实际跑在哪</text>
  <text x="440" y="48" text-anchor="middle" class="note">通过 executor.exec() 把 hook 推到用户容器 · 和 LLM Bash 调用同根</text>

  <!-- Host machine -->
  <rect x="30" y="75" width="820" height="370" rx="8" class="host"/>
  <text x="50" y="98" class="header" fill="#7f1d1d">Host Machine（hook 永远不可触达）</text>
  <text x="50" y="115" class="note">host filesystem · host shell · root 权限 · 其他用户容器</text>

  <!-- Engine container (left) -->
  <rect x="60" y="140" width="350" height="290" rx="6" class="engine-box"/>
  <text x="80" y="163" class="header" fill="#4c1d95">Engine 容器（HarWork 服务进程）</text>
  <text x="80" y="180" class="note">packages/engine/src/</text>

  <rect x="80" y="200" width="310" height="44" rx="4" class="component"/>
  <text x="95" y="220" class="label" font-weight="600">hook executor（调度器）</text>
  <text x="95" y="236" class="label-mono-sm">hooks/executor.ts</text>

  <rect x="80" y="252" width="310" height="44" rx="4" class="component"/>
  <text x="95" y="272" class="label" font-weight="600">注入 HOOK_INPUT env var</text>
  <text x="95" y="288" class="label-mono-sm">export HOOK_INPUT=$(escape...)</text>

  <rect x="80" y="304" width="310" height="44" rx="4" class="component"/>
  <text x="95" y="324" class="label" font-weight="600">监控 timeout / 聚合结果</text>
  <text x="95" y="340" class="label-mono-sm">DEFAULT_HOOK_TIMEOUT_S = 60</text>

  <rect x="80" y="356" width="310" height="44" rx="4" class="component"/>
  <text x="95" y="376" class="label" font-weight="600">解析 stdout JSON / 退出码</text>
  <text x="95" y="392" class="label-mono-sm">0=success · 2=blocking · other=non_blocking</text>

  <!-- User container (right) -->
  <rect x="450" y="140" width="370" height="290" rx="6" class="user-box"/>
  <text x="470" y="163" class="header" fill="#1e3a8a">用户专属容器（每个 user 一个）</text>
  <text x="470" y="180" class="note">和 LLM Bash 工具共享同一 Docker 容器</text>

  <rect x="470" y="200" width="330" height="60" rx="4" class="hook-cmd"/>
  <text x="485" y="218" class="label" font-weight="600" fill="#78350f">▶ hook 命令实际执行点</text>
  <text x="485" y="236" class="label-mono-sm">$ export HOOK_INPUT='{"hook_event_name":...}'</text>
  <text x="485" y="252" class="label-mono-sm">$ user-script.sh  # ← 用户自己写的脚本</text>

  <rect x="470" y="270" width="155" height="50" rx="4" class="component"/>
  <text x="478" y="288" class="label" font-weight="600">/workspace</text>
  <text x="478" y="304" class="label-sm">读写文件</text>
  <text x="478" y="316" class="note">和 LLM 共享</text>

  <rect x="640" y="270" width="160" height="50" rx="4" class="component"/>
  <text x="648" y="288" class="label" font-weight="600">资源 limits</text>
  <text x="648" y="304" class="label-sm">2 CPU / 3 GB / non-root</text>
  <text x="648" y="316" class="note">User: worker</text>

  <rect x="470" y="332" width="330" height="44" rx="4" class="component"/>
  <text x="485" y="352" class="label" font-weight="600">回写 stdout / exit code</text>
  <text x="485" y="368" class="label-mono-sm">echo '{"decision":"block"}'  # → JSON 信道</text>

  <rect x="470" y="384" width="330" height="40" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
  <text x="485" y="402" class="label" font-weight="600" fill="#7f1d1d">隔离边界</text>
  <text x="485" y="416" class="label-sm" fill="#7f1d1d">✗ Engine .env · ✗ 其他用户容器 · ✗ host /</text>

  <!-- Bridge arrow -->
  <line x1="410" y1="222" x2="450" y2="222" class="exec-arrow" marker-end="url(#hb-exec)"/>
  <text x="430" y="216" text-anchor="middle" class="note" fill="#047857" font-weight="600">exec()</text>

  <line x1="450" y1="296" x2="410" y2="370" class="arrow" stroke-dasharray="3 2" marker-end="url(#hb-arr)"/>
  <text x="425" y="345" class="note">stdout</text>

  <!-- Blocked arrows to host -->
  <line x1="640" y1="135" x2="640" y2="85" class="blocked-arrow" stroke-dasharray="5 3" marker-end="url(#hb-block)"/>
  <text x="660" y="115" class="note" fill="#7f1d1d">🚫 cannot escape</text>

  <!-- Bottom takeaway -->
  <rect x="40" y="460" width="800" height="85" fill="#fff" stroke="#1a2233" rx="4"/>
  <text x="55" y="480" class="label" font-weight="700">核心设计：hook 和 LLM 共享同一隔离边界</text>
  <text x="55" y="500" class="label">✓ <tspan font-weight="600" fill="#047857">权限对等</tspan> —— hook 能做的事，LLM 也能做；LLM 能做的事，hook 也能做（同一 /workspace、同一 user worker）</text>
  <text x="55" y="518" class="label">✓ <tspan font-weight="600" fill="#047857">故障隔离</tspan> —— hook 卡死最多打满当前容器（2 CPU / 3 GB），Engine 不受影响</text>
  <text x="55" y="536" class="label">✗ <tspan font-weight="600" fill="#7f1d1d">朴素错误</tspan>: child_process.exec(hook.command) in Engine —— 用户脚本立刻读到 Engine .env / kill 别人</text>
</svg>
