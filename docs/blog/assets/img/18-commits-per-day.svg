  <line x1="60" y1="80" x2="60" y2="370" class="axis"/>
  <line x1="60" y1="370" x2="920" y2="370" class="axis"/>

  <!-- Y-axis ticks -->
  <text x="55" y="374" text-anchor="end" class="label-sm">0</text>
  <line x1="55" y1="335" x2="60" y2="335" class="axis"/>
  <text x="55" y="339" text-anchor="end" class="label-sm">10</text>
