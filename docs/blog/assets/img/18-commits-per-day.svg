  <rect x="60" y="400" width="860" height="70" rx="4" fill="#fff" stroke="#0284c7"/>
  <text x="70" y="420" class="label header">分布特征 · "按主题井喷"非"按周匀速"</text>
  <text x="70" y="438" class="label-sm">• 4 月 137 commits / 5 月 150 commits — 5 月偏重设计模块（Part 14-16）</text>
  <text x="70" y="455" class="label-sm">• 31 活跃日 / 49 总日 = 63% 活跃率 · 其余 18 天写 spec / 推论 / 思考非 commit 活动</text>
  <text x="500" y="438" class="label-sm">• 单日峰值 38 (5-13)</text>
  <text x="500" y="455" class="label-sm">• 单日中位数 ≈ 7</text>
