<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-cd d-cd">
  <title id="t-cd">HarWork 49 天 commits/day 真实分布</title>
  <desc id="d-cd">数据来自 git log --pretty=format:%ad --date=short | sort | uniq -c，展示 HarWork 项目 2026-04-08 到 2026-05-26 的每日提交分布。峰值是 5-13（38 commits / 设计模块爆炸日）和 4-30（32 commits / Phase 3 收尾日），其余多数日为个位数。曲线证明"按主题井喷"而非"按周匀速"。</desc>
  <style>
    .label { fill: #1a1a1a; font-size: 11px; }
    .label-sm { fill: #1a1a1a; font-size: 10px; }
    .label-mono { fill: #1a1a1a; font-size: 10.5px; font-family: 'SF Mono', Consolas, monospace; }
    .note { fill: #5a5a5a; font-size: 10px; font-style: italic; }
    .header { font-weight: 700; font-size: 12px; }
    .axis { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d4d4d4; stroke-width: 0.5; fill: none; stroke-dasharray: 2 2; }
    .bar { fill: #2563eb; }
    .bar-peak { fill: #b91c1c; }
    .bar-hi { fill: #ea580c; }
    .annot-line { stroke: #b91c1c; stroke-width: 1; fill: none; stroke-dasharray: 3 2; }
  </style>

  <text x="20" y="26" class="header" font-size="14">HarWork commits/day · 真实 git log（2026-04-08 → 2026-05-26）</text>
  <text x="20" y="44" class="note">数据源：git log --pretty=format:'%ad' --date=short | sort | uniq -c · 共 287 commits / 31 个活跃日 / 49 天跨度</text>

