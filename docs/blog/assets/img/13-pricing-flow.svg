<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t-pf d-pf">
  <title id="t-pf">按模型计费数据流 · usage → estimateCostByModel → usage_update 事件</title>
  <desc id="d-pf">展示每轮 LLM 调用后，result.usage 经 estimateCostByModel 查表换算 USD，再以 usage_update 事件广播给前端 UI 实时显示。pricing 表按 modelId 索引，USD 统一汇率预转，DEFAULT_PRICING={3,3} 兜底未知模型。</desc>
  <style>
    .label { fill: #1a1a1a; font-size: 11px; }
    .label-sm { fill: #1a1a1a; font-size: 10px; }
    .label-mono { fill: #1a1a1a; font-size: 10px; font-family: 'SF Mono', Consolas, monospace; }
    .label-mono-sm { fill: #1a1a1a; font-size: 9.5px; font-family: 'SF Mono', Consolas, monospace; }
    .note { fill: #5a5a5a; font-size: 10px; font-style: italic; }
    .header { font-weight: 700; font-size: 12px; }
    .step-box { fill: #fff; stroke: #1a2233; stroke-width: 1.5; }
    .price-cheap { fill: #d1fae5; stroke: #047857; }
    .price-mid { fill: #fef3c7; stroke: #a16207; }
    .price-expensive { fill: #fee2e2; stroke: #b91c1c; }
    .ui-box { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; }
    .default-box { fill: #f3f4f6; stroke: #6b7280; stroke-dasharray: 4 2; }
    .arrow { stroke: #1a2233; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="pf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="580" fill="#fafbfc" stroke="#1a2233" stroke-width="2"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">按模型计费数据流 · LLM usage → USD → 前端 UI</text>
  <text x="440" y="48" text-anchor="middle" class="note">agent/loop.ts:241-265 · models/pricing.ts:6-42</text>

  <!-- Step 1: usage from SDK -->
  <text x="50" y="78" class="header">▶ Step 1: 每轮 streamText 结束 · SDK 报告 usage</text>
  <rect x="40" y="92" width="320" height="78" rx="4" class="step-box"/>
  <text x="50" y="111" class="label-mono">const usage = await result.usage</text>
  <text x="50" y="127" class="label-mono">// usage.totalTokens = 5234</text>
  <text x="50" y="143" class="label-mono">// usage.outputTokens = 432</text>
  <text x="50" y="159" class="label-mono">//   ?? usage.completionTokens</text>

  <text x="370" y="115" class="note">SDK 版本差异：v4 用</text>
  <text x="370" y="130" class="note">completionTokens，v5 用</text>
  <text x="370" y="145" class="note">outputTokens — HarWork ??</text>
  <text x="370" y="160" class="note">兜底两个字段都接</text>

  <!-- Arrow down -->
  <path d="M 200 170 L 200 200" class="arrow" marker-end="url(#pf-arr)"/>

  <!-- Step 2: estimateCostByModel -->
  <text x="50" y="200" class="header">▶ Step 2: estimateCostByModel(modelId, inputTokens, outputTokens)</text>
  <rect x="40" y="214" width="800" height="120" rx="4" class="step-box"/>
  <text x="50" y="232" class="label-mono">pricing = MODEL_PRICING[modelId] || DEFAULT_PRICING</text>
  <text x="50" y="247" class="label-mono">cost = (inputTokens × pricing.inputPer1M + outputTokens × pricing.outputPer1M) / 1_000_000</text>

  <!-- Pricing table visualization -->
  <g transform="translate(50, 258)">
    <text x="0" y="12" class="label-sm" font-weight="600">MODEL_PRICING 表（USD per 1M tokens · RMB 预转 ~7.2）:</text>

    <rect x="0" y="20" width="180" height="48" rx="3" class="price-expensive"/>
    <text x="6" y="34" class="label-mono-sm" fill="#7f1d1d">claude-opus-4</text>
    <text x="6" y="48" class="label-mono-sm">in: $15  out: $75</text>
    <text x="6" y="62" class="label-mono-sm" font-style="italic">5× input vs output</text>

    <rect x="186" y="20" width="170" height="48" rx="3" class="price-mid"/>
    <text x="192" y="34" class="label-mono-sm" fill="#78350f">claude-sonnet-4</text>
    <text x="192" y="48" class="label-mono-sm">in: $3  out: $15</text>
    <text x="192" y="62" class="label-mono-sm">gpt-4o: in $2.5 out $10</text>

    <rect x="362" y="20" width="200" height="48" rx="3" class="price-cheap"/>
    <text x="368" y="34" class="label-mono-sm" fill="#065f46">deepseek:v4-pro</text>
    <text x="368" y="48" class="label-mono-sm">in: $0.28  out: $1.11</text>
    <text x="368" y="62" class="label-mono-sm">zhipu:glm-4.7 in/out: $0.69</text>

    <rect x="568" y="20" width="220" height="48" rx="3" class="price-cheap"/>
    <text x="574" y="34" class="label-mono-sm" fill="#065f46">qwen:qwen-turbo</text>
    <text x="574" y="48" class="label-mono-sm">in: $0.04  out: $0.17</text>
    <text x="574" y="62" class="label-mono-sm">最便宜 · vs Opus 输出 440×</text>
  </g>

  <!-- Default fallback -->
  <rect x="500" y="200" width="320" height="58" rx="4" class="default-box"/>
  <text x="660" y="218" text-anchor="middle" class="label-sm" font-weight="600" fill="#374151">DEFAULT_PRICING fallback</text>
  <text x="660" y="234" text-anchor="middle" class="label-mono-sm">{inputPer1M: 3, outputPer1M: 3}</text>
  <text x="660" y="250" text-anchor="middle" class="note">未知 modelId 兜底 · 但坑：写错 id 永远收 $3</text>

  <!-- Arrow down -->
  <path d="M 440 335 L 440 365" class="arrow" marker-end="url(#pf-arr)"/>

  <!-- Step 3: usage_update event -->
  <text x="50" y="365" class="header">▶ Step 3: yield usage_update 事件 → session.broadcast → WebSocket → UI</text>
  <rect x="40" y="378" width="800" height="98" rx="4" class="step-box"/>
  <text x="50" y="398" class="label-mono">yield {</text>
  <text x="60" y="412" class="label-mono">type: 'usage_update',</text>
  <text x="60" y="426" class="label-mono">turnTokens: 5234,         turnCompletionTokens: 432,</text>
  <text x="60" y="440" class="label-mono">totalTokens: 18420,       totalCompletionTokens: 1820,</text>
  <text x="60" y="454" class="label-mono">costUsd: 0.0234,          contextWindowPercent: 9</text>
  <text x="50" y="468" class="label-mono">}</text>

  <!-- Arrow down -->
  <path d="M 440 476 L 440 500" class="arrow" marker-end="url(#pf-arr)"/>

  <!-- Final: UI display -->
  <rect x="240" y="500" width="400" height="40" rx="6" class="ui-box"/>
  <text x="440" y="520" text-anchor="middle" class="label" font-weight="700" fill="#1e40af">前端 token counter · 9% ctx · $0.0234 · 实时更新</text>
  <text x="440" y="535" text-anchor="middle" class="label-sm">每轮一次 · 用户能看见自己的 burn rate</text>

  <!-- Bottom takeaway -->
  <rect x="40" y="550" width="800" height="22" fill="#fff" stroke="#1a2233" rx="3"/>
  <text x="55" y="566" class="label" font-weight="700">关键：pricing 按 modelId 索引（不按 provider）· 同一 provider 的不同模型价格可以差 5 倍 · 跨 provider 可差 440 倍</text>
</svg>
